name: seddo
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+22

environment:
  sdk: ^3.12.2


dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.1
  easy_localization: ^3.0.8
  google_maps_flutter: ^2.18.1
  geolocator: ^14.1.2
  dio: ^5.11.1
  uuid: ^4.6.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  pdf: ^3.13.1
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.3
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_tts: ^4.2.5
  socket_io_client: ^3.1.6
  app_links: ^7.2.2
  flutter_speed_dial: ^7.0.0
  flutter_typeahead: ^6.0.0
  intl: ^0.20.2
  bloc: ^9.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  bloc_test: ^10.0.0
flutter:


  uses-material-design: true

  # Assets
  assets:
    - assets/icons/
    - assets/images/
    - assets/images/tcu/
    - assets/transit/
    - assets/transit/icons/
    - assets/translations/
    - assets/map_style.json
    - shorebird.yaml


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/SEDDO.png"
  adaptive_icon_background: "#FF5F00"
  adaptive_icon_foreground: "assets/images/SEDDO.png"
  min_sdk_android: 21

